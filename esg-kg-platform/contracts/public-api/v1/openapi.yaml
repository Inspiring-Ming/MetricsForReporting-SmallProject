openapi: 3.1.0
info:
	title: ESG Platform Public API
	version: 1.0.0
	description: |
		Public Write API for validation, ingestion, and computation execution.
		- /ingest/* endpoints write validated data to GraphDB (JSON only)
		- /compute executes a registered computation model and returns the result (does not auto-persist)
servers:
	- url: https://api.example.com
	- url: http://localhost:3001
paths:
	/public/v1/ingest/metric:
		post:
			summary: Ingest a single direct measurement metric (JSON only)
			description: |
				Accepts pre-calculated direct measurement values only. For calculated metrics, use /public/v1/compute first to obtain a value, then optionally POST the result here for storage.
				parameters:
					- in: header
						name: X-Request-ID
						required: false
						schema: { type: string }
						description: Optional request correlation ID
					- in: header
						name: Idempotency-Key
						required: false
						schema: { type: string, maxLength: 255 }
						description: Optional idempotency key
			requestBody:
				required: true
				content:
					application/json:
						schema:
							$ref: '#/components/schemas/ESGMetric'
			responses:
				'201':
					description: Created
					content:
						application/json:
							schema:
								$ref: '#/components/schemas/IngestResponse'
				'409':
					description: Conflict
					content:
						application/problem+json:
							schema:
								$ref: '#/components/schemas/ProblemDetails'
				'422':
					description: Validation Failed
					content:
						application/problem+json:
							schema:
								$ref: '#/components/schemas/ProblemDetails'
	/public/v1/compute:
		post:
			summary: Execute a computation model and return the computed result
			description: |
				Executes a registered computation method/model identified by `code` using provided `inputValues` and returns the computed metric value and metadata. This endpoint does not persist results automatically.
				parameters:
					- in: header
						name: X-Request-ID
						required: false
						schema: { type: string }
						description: Optional request correlation ID
					- in: header
						name: Idempotency-Key
						required: false
						schema: { type: string, maxLength: 255 }
						description: Optional idempotency key
			requestBody:
				required: true
				content:
					application/json:
						schema:
							$ref: '#/components/schemas/ComputationRequest'
			responses:
				'200':
					description: Computation successful
					content:
						application/json:
							schema:
								$ref: '#/components/schemas/ComputationResult'
				'400':
					description: Bad Request / Computation Failed
					content:
						application/problem+json:
							schema:
								$ref: '#/components/schemas/ProblemDetails'
				'404':
					description: Model not found
					content:
						application/problem+json:
							schema:
								$ref: '#/components/schemas/ProblemDetails'
components:
	schemas:
		ESGMetric:
			type: object
				required: [framework, industry, code, entityId, value, unitIri, asOf, source]
			properties:
				framework:
					type: string
					description: Reporting framework (e.g., SASB, GRI)
				industry:
					type: string
				code:
					type: string
					description: Registered computation code linked to specific metric logic
				entityId:
					type: string
				value:
					type: number
				unitIri:
					type: string
					format: uri
				asOf:
					type: string
					format: date-time
				source:
					type: string
		IngestResponse:
			type: object
			properties:
				success:
					type: boolean
				batchId:
					type: string
				metricIri:
					type: string
					format: uri
				namedGraph:
					type: string
					format: uri
				triplesCount:
					type: integer
				duration:
					type: integer
				location:
					type: string
					format: uri
		ComputationRequest:
			type: object
				required: [framework, industry, code, entityId, inputValues, asOf, source]
			properties:
				framework:
					type: string
				industry:
					type: string
				code:
					type: string
				entityId:
					type: string
				inputValues:
					type: object
					additionalProperties:
						type: number
				asOf:
					type: string
					format: date-time
				source:
					type: string
		ComputationResult:
			type: object
			properties:
				success:
					type: boolean
				result:
					type: object
					properties:
						computationId:
							type: string
						value:
							type: number
						unitIri:
							type: string
							format: uri
						computedAt:
							type: string
							format: date-time
						method:
							type: object
							properties:
								code: { type: string }
								modelName: { type: string }
								formula: { type: string }
						inputValues:
							type: object
							additionalProperties:
								type: number
						generatedMetric:
							$ref: '#/components/schemas/ESGMetric'
						duration:
							type: integer
		ProblemDetails:
			type: object
			properties:
				type: { type: string, format: uri }
				title: { type: string }
				status: { type: integer }
				detail: { type: string }
				instance: { type: string }
